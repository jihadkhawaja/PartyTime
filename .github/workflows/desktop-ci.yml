name: Verify Avalonia desktop
on:
  push:
    branches: [main, avalonia]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build PartyTime.csproj -c Release
      - name: Run portable analysis, rendering, and controls checks
        run: dotnet run --project Tests/PartyTime.Tests.csproj -c Release
      - name: Verify macOS single-file app packages
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for runtime in osx-x64 osx-arm64; do
            bash scripts/publish.sh "$runtime"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: feature-checks-${{ matrix.os }}
          path: artifacts/feature-checks
