name: Publish Windows executable

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build self-contained Windows x64 executable
        run: >-
          dotnet publish PartyTime.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -o artifacts/release-win-x64

      - name: Attach executable to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $fileTag = $env:RELEASE_TAG -creplace '[^A-Za-z0-9._-]', '-'
          $assetName = "win-x64-$fileTag.exe"
          Rename-Item -LiteralPath 'artifacts/release-win-x64/PartyTime.exe' -NewName $assetName
          gh release upload --repo "$env:GITHUB_REPOSITORY" -- "$env:RELEASE_TAG" "artifacts/release-win-x64/$assetName"
