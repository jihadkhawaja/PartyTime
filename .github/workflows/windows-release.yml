name: Publish Windows executable

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: windows-2025
    permissions:
      contents: write
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build self-contained Windows ${{ matrix.runtime }} executable
        run: >-
          dotnet publish PartyTime.csproj -c Release -r ${{ matrix.runtime }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -o artifacts/release-${{ matrix.runtime }}

      - name: Attach executable to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          $fileTag = $env:RELEASE_TAG -creplace '[^A-Za-z0-9._-]', '-'
          $assetName = "$env:RUNTIME-$fileTag.exe"
          $outputDirectory = "artifacts/release-$env:RUNTIME"
          Rename-Item -LiteralPath "$outputDirectory/PartyTime.exe" -NewName $assetName
          gh release upload --repo "$env:GITHUB_REPOSITORY" -- "$env:RELEASE_TAG" "$outputDirectory/$assetName"
